<style>

  .chip[aria-pressed="true"]{background:#eef6ff;border-color:#c9e6ff}
  .thumb{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#f3f4f6;border:1px solid #e7e9ee;font-size:14px}
  .results{display:grid;gap:12px}

  .tag{font-size:12px;border:1px solid #e5e7eb;border-radius:999px;padding:2px 8px;background:#f9fafb}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
  .modal{background:#fff;border-radius:16px;max-width:680px;width:100%;padding:16px 16px 14px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
  .modal h2{margin:4px 0 6px 0;font-size:20px}
  .modal .row{align-items:center}
  .pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer}
  .close{position:absolute;top:8px;right:10px;font-size:20px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;padding:4px 8px}
  .navBtn{position:absolute;top:50%;transform:translateY(-50%);font-size:20px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;padding:6px 10px}
  .prev{left:-44px} .next{right:-44px}
  .badge{position:absolute;top:8px;left:10px;background:#dcfce7;border:1px solid #86efac;color:#14532d;font-size:12px;border-radius:999px;padding:2px 8px}

const $=s=>document.querySelector(s);
const tabs=[$("#tabL1"),$("#tabL2")];
const q=$("#q"), catSel=$("#cat"), chips=$("#chips"), results=$("#results");
const btnEN=$("#toggle-en"), btnStudy=$("#study"), btnReset=$("#reset");
let STATE={lesson:"L1",q:"",cat:"",showEN:true,study:false};

// Modal refs
const overlay=$("#overlay"), modClose=$("#mod-close"), modPrev=$("#mod-prev"), modNext=$("#mod-next");
const modEmoji=$("#mod-emoji"), modTitle=$("#mod-title"), modCat=$("#mod-cat"), modEn=$("#mod-en"), modTags=$("#mod-tags"), modKnown=$("#mod-known");
const btnReveal=$("#btn-reveal"), btnHide=$("#btn-hide"), btnMark=$("#btn-mark");
let CURRENT_INDEX=0;

// session reveal + persistent known
let REVEALED = new Set();
const LS_KEY = "u1_migeneracion_known_modal_v1";
let KNOWN = new Set(JSON.parse(localStorage.getItem(LS_KEY)||"[]"));

function setLesson(l){STATE.lesson=l; tabs.forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lesson===l))); renderAll();}
tabs[0].onclick=()=>setLesson("L1"); tabs[1].onclick=()=>setLesson("L2");
q.oninput=()=>{STATE.q=q.value; renderList();};
catSel.onchange=()=>{STATE.cat=catSel.value; renderChips(); renderList();};
btnEN.onclick=()=>{STATE.showEN=!STATE.showEN; btnEN.textContent=STATE.showEN?'Hide EN':'Show EN'; renderList();};
btnStudy.onclick=()=>{STATE.study=!STATE.study; btnStudy.textContent=STATE.study?'Study mode: ON':'Study mode (flashcards)'; REVEALED.clear(); renderList();};
btnReset.onclick=()=>{STATE.q=''; q.value=''; STATE.cat=''; REVEALED.clear(); renderAll();};

function renderAll(){renderChips(); renderSelect(); renderList();}
function catsForLesson(l){return [...new Set(DATA.filter(x=>x.lesson===l).map(x=>x.category_es))].sort();}
function renderChips(){
  chips.innerHTML='';
  for(const c of catsForLesson(STATE.lesson)){
    const el=document.createElement('button');
    el.className='chip'; el.setAttribute('aria-pressed', String(STATE.cat===c));
    el.innerHTML=`<span class="thumb">${EMOJI[c]||'🧩'}</span><span>${c}</span>`;
    el.onclick=()=>{ STATE.cat=(STATE.cat===c?'':c); renderChips(); renderSelect(); renderList(); };
    chips.appendChild(el);
  }
}
function renderSelect(){
  const cats=catsForLesson(STATE.lesson);
  catSel.innerHTML='<option value="">All categories (ES)</option>'+cats.map(c=>`<option ${STATE.cat===c?'selected':''} value="${c}">${c}</option>`).join('');
}
function filterData(){
  const qq=STATE.q.toLowerCase();
  return DATA.filter(x=>x.lesson===STATE.lesson && (!STATE.cat||x.category_es===STATE.cat) && (!qq||(x.es+x.en+x.category_es+(x.tags||[]).join(' ')).toLowerCase().includes(qq)));
}

// Modal helpers
function openModalAt(index){ CURRENT_INDEX=index; updateModal(); overlay.style.display='flex'; overlay.setAttribute('aria-hidden','false'); }
function closeModal(){ overlay.style.display='none'; overlay.setAttribute('aria-hidden','true'); }
function nextModal(d){ const items=filterData(); CURRENT_INDEX=(CURRENT_INDEX+d+items.length)%items.length; updateModal(); }

function setKnown(id,val){ if(val) KNOWN.add(id); else KNOWN.delete(id); localStorage.setItem(LS_KEY, JSON.stringify([...KNOWN])); updateModal(); renderList(); }
function toggleReveal(id){ if(REVEALED.has(id)) REVEALED.delete(id); else REVEALED.add(id); updateModal(); }

function updateModal(){
  const items=filterData();
  const it=items[CURRENT_INDEX];
  const known=KNOWN.has(it.id);
  const revealed = !STATE.study ? STATE.showEN : (REVEALED.has(it.id) || known);
  modEmoji.textContent = EMOJI[it.category_es]||'🧩';
  modCat.textContent = it.category_es;
  modTitle.textContent = it.es;
  modEn.textContent = 'EN: '+it.en;
  modEn.classList.toggle('hidden', !revealed);
  modTags.innerHTML = (it.tags||[]).map(t=>`<span class='tag'>${t}</span>`).join('');
  modKnown.classList.toggle('hidden', !known);
  btnReveal.onclick=()=>toggleReveal(it.id);
  btnHide.onclick = ()=>toggleReveal(it.id);
  btnMark.textContent = known ? 'Unmark known' : 'Mark known';
  btnMark.onclick = ()=>setKnown(it.id, !known);
}

function renderList(){
  const items=filterData();
  results.innerHTML='';
  if(!items.length){const d=document.createElement('div'); d.className='muted'; d.textContent='No items.'; results.appendChild(d); return;}
  items.forEach((it,idx)=>{
    const known = KNOWN.has(it.id);
    const revealed = !STATE.study ? STATE.showEN : (REVEALED.has(it.id) || known);
    const card=document.createElement('article'); card.className='card'+(known?' known':'');
    card.onclick=()=>openModalAt(idx);
    card.innerHTML=`<div class="emoji">${EMOJI[it.category_es]||'🧩'}</div>
      <div>
        <h3>${it.es}</h3>
        <div class="muted ${revealed?'':'hidden'}"><strong>EN:</strong> ${it.en}</div>
        <div class="muted">${it.category_es}</div>
        <div class="tags">${(it.tags||[]).map(t=>`<span class='tag'>${t}</span>`).join('')}</div>
      </div>`;
    results.appendChild(card);
  });
}

modClose.onclick=closeModal;
modPrev.onclick=()=>nextModal(-1);
modNext.onclick=()=>nextModal(1);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{
  if(overlay.style.display==='flex'){
    if(e.key==='Escape') closeModal();
    if(e.key==='ArrowLeft') nextModal(-1);
    if(e.key==='ArrowRight') nextModal(1);
  }
});

renderAll();
</script>
